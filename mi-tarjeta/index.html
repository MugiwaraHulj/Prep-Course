<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Franco Huljich | Entrenamiento Personalizado</title>
<meta name="description" content="Franco Huljich, Lic. en Educación Física (Ciencias del Deporte). Entrenamiento personalizado.">
<meta name="theme-color" content="#0b0d10">
<style>
  :root{
    --bg:#0b0d10; --card:#14181d; --line:#232932; --text:#f2f5f7; --muted:#9aa5b1;
    --accent:#c6ff3d; --accent-ink:#0b0d10; --wa:#25d366;
  }
  *{box-sizing:border-box;margin:0}
  [hidden]{display:none!important}
  body{
    min-height:100vh; display:grid; place-items:center; padding:24px 16px;
    background:
      radial-gradient(600px 300px at 80% -10%, rgba(198,255,61,.14), transparent 60%),
      radial-gradient(500px 300px at -10% 110%, rgba(198,255,61,.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:420px; background:var(--card); border:1px solid var(--line);
    border-radius:28px; padding:32px 24px 24px; text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  }
  .avatar{
    width:112px; height:112px; border-radius:50%; margin:0 auto 18px;
    display:grid; place-items:center; overflow:hidden;
    background:linear-gradient(135deg,var(--accent),#7fd11a);
    color:var(--accent-ink); font-weight:800; font-size:38px; letter-spacing:1px;
    box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--accent);
  }
  .avatar img{width:100%;height:100%;object-fit:cover}
  h1{font-size:1.65rem;letter-spacing:-.02em}
  .role{color:var(--accent);font-weight:600;margin-top:6px;font-size:.98rem}
  .sub{color:var(--muted);font-size:.9rem;margin-top:6px;line-height:1.4}
  h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:26px 0 12px;text-align:left}
  .tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start}
  .tags span{
    border:1px solid var(--line); background:#0f1318; padding:8px 13px;
    border-radius:999px; font-size:.86rem;
  }
  .actions{display:grid;gap:10px;margin-top:26px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:15px 18px;border-radius:16px;border:1px solid var(--line);
    font:inherit;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;
    color:var(--text);background:#0f1318;transition:transform .12s,filter .12s;
  }
  .btn:hover{filter:brightness(1.12)} .btn:active{transform:scale(.98)}
  .btn svg{width:20px;height:20px;flex:none}
  .btn.wa{background:var(--wa);border-color:var(--wa);color:#04210f}
  .btn.copy.done{border-color:var(--accent);color:var(--accent)}
  .email-line{color:var(--muted);font-size:.82rem;margin-top:-2px}
  footer{margin-top:22px;color:#5d6773;font-size:.75rem}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<main class="card">
  <div class="avatar" id="avatar">FH</div>

  <h1>Franco Huljich</h1>
  <p class="role">Entrenador personalizado</p>
  <p class="sub">Licenciado en Educación Física<br>Orientación en Ciencias del Deporte</p>

  <h2>Servicios</h2>
  <div class="tags" id="services"></div>

  <div class="actions">
    <a class="btn wa" id="wa" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11.9 11.9 0 0 0 12 0C5.4 0 0 5.4 0 12c0 2.1.6 4.2 1.6 6L0 24l6.2-1.6A12 12 0 0 0 12 24c6.6 0 12-5.4 12-12 0-3.2-1.2-6.2-3.5-8.5zM12 22a10 10 0 0 1-5.1-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A10 10 0 1 1 12 22zm5.5-7.5c-.3-.1-1.8-.9-2-1s-.5-.1-.7.1-.8 1-1 1.2-.4.2-.7.1a8 8 0 0 1-4-3.5c-.3-.5.3-.5.9-1.6.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.700 3.700 0 0 0-1.100 2.700c0 1.600 1.200 3.200 1.300 3.400.2.200 2.300 3.500 5.600 4.900 2 .8 2.800.9 3.800.7.600-.1 1.800-.7 2-1.400.3-.7.300-1.300.2-1.400s-.3-.2-.6-.3z"/></svg>
      Escribime por WhatsApp
    </a>
    <button class="btn copy" id="copy" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      <span id="copyText">Copiar email</span>
    </button>
    <p class="email-line" id="emailLine"></p>
    <a class="btn" id="ig" target="_blank" rel="noopener" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.500" cy="6.500" r="1" fill="currentColor"/></svg>
      Instagram
    </a>
  </div>

  <footer>© Franco Huljich</footer>
</main>

<script>
  /* ====== EDITÁ ACÁ TUS DATOS ====== */
  const CONFIG = {
    email: "fhuljich@gmail.com",
    whatsapp: "5493414686786",      // 54 (Argentina) + 9 + 341 4686786
    whatsappMsg: "Hola Franco, vi tu tarjeta y quiero consultarte por entrenamiento.",
    instagram: "",                  // Ej: "https://instagram.com/tuusuario" (vacío = botón oculto)
    foto: "",                       // Ej: "foto.jpg" (misma carpeta) o una imagen en base64 (vacío = iniciales FH)
    servicios: [
      "Planes personalizados",
      "Entrenamiento de fuerza",
      "Rendimiento deportivo",
      "Acondicionamiento físico",
      "Seguimiento y evaluación"
    ]
  };
  /* ================================= */

  const $ = id => document.getElementById(id);

  $("services").innerHTML = CONFIG.servicios.map(s => `<span>${s}</span>`).join("");
  $("emailLine").textContent = CONFIG.email;
  $("wa").href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(CONFIG.whatsappMsg)}`;

  if (CONFIG.instagram) { $("ig").href = CONFIG.instagram; $("ig").hidden = false; }

  if (CONFIG.foto) {
    const img = new Image();
    img.alt = "Franco Huljich";
    img.onload = () => { $("avatar").textContent = ""; $("avatar").appendChild(img); };
    img.src = CONFIG.foto;
  }

  $("copy").addEventListener("click", async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(CONFIG.email); ok = true; }
    catch (e) {
      const t = document.createElement("textarea");
      t.value = CONFIG.email; document.body.appendChild(t); t.select();
      try { ok = document.execCommand("copy"); } catch (_) {}
      t.remove();
    }
    $("copyText").textContent = ok ? "¡Email copiado!" : "Copialo: " + CONFIG.email;
    $("copy").classList.toggle("done", ok);
    setTimeout(() => { $("copyText").textContent = "Copiar email"; $("copy").classList.remove("done"); }, 2200);
  });
</script>
</body>
</html>
